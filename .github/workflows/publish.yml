name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - name: Populate model cache for tests
        run: |
          node bin/ima.js list-models text_to_image
          node bin/ima.js list-models image_to_image
          node bin/ima.js list-models text_to_video
          node bin/ima.js list-models text_to_music
          node bin/ima.js list-models text_to_speech
        env:
          IMA_API_KEY: ${{ secrets.IMA_API_KEY }}

      - run: npm test

      - run: npm publish --provenance --access public
